name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 覆盖率下限:只许涨不许跌。补了测试就把这个数往上抬。
  COV_MIN: "60"

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # mypy 要能看到 vendor 里动态加载的模块,行为才和本地一致
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install deps
        run: uv sync --extra dev

      - name: ruff
        run: uv run --no-sync ruff check --output-format=github wecom_svr tests

      - name: mypy
        # 前面挂了也要跑完,一次 PR 把两类问题都看全
        if: always()
        run: uv run --no-sync mypy

  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # 服务本身只在 macOS 上真跑(以本人身份发消息要 osascript),
          # 所以主版本额外压一遍 macOS,防止只在 Linux 上绿。
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4
        with:
          # vendor/wecom-agent 是契约测试的被测对象,必须拉下来,
          # 否则 test_vendor_contract / test_online 会整体 skip。
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install deps
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: >
          uv run --no-sync pytest -v
          --cov-report=xml
          --cov-report=term-missing
          --cov-fail-under=${{ env.COV_MIN }}

      - name: Coverage summary
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          {
            echo "## 覆盖率 (py${{ matrix.python-version }})"
            echo
            uv run --no-sync coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage.xml
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      # ── 覆盖率徽章 ────────────────────────────────────────────────────
      # 只在 main 上、且只由 ubuntu/3.12 那一格更新:徽章是仓库级别的单一值,
      # 五个矩阵格子都写就会互相覆盖成谁最后跑完算谁。
      # PR 不写 —— fork 来的 PR 拿不到 secret,而且 PR 的数字不该盖掉 main 的。
      - name: Read coverage total
        id: cov
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          pct=$(uv run --no-sync coverage report --format=total)
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          # 配色跟着 COV_MIN 走:压线是黄的,离下限越远越绿
          if   [ "$pct" -ge 80 ]; then echo "color=brightgreen" >> "$GITHUB_OUTPUT"
          elif [ "$pct" -ge 60 ]; then echo "color=green"       >> "$GITHUB_OUTPUT"
          elif [ "$pct" -ge "${{ env.COV_MIN }}" ]; then echo "color=yellow" >> "$GITHUB_OUTPUT"
          else echo "color=red" >> "$GITHUB_OUTPUT"
          fi

      - name: Update coverage badge
        if: steps.cov.outputs.pct != ''
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COV_GIST_ID }}
          # 必须和 README 徽章 URL 里的文件名一致,对不上徽章就永远停在初始值
          filename: coverage.json
          label: coverage
          message: ${{ steps.cov.outputs.pct }}%
          color: ${{ steps.cov.outputs.color }}
