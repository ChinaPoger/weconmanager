[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wecom-svr"
version = "0.1.0"
description = "企业微信消息发送服务 — FastAPI 封装,底层引用 wecom-agent"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    # 群消息同步要自己增量解密 Info.db(wxwork_crypto 的后端之一)
    "cryptography>=42.0",
    # mars 前端不识别 HEIC/.bin;图片上传前统一规范成可渲染格式。
    "Pillow>=10.0",
    "pillow-heif>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
wecom-svr = "wecom_svr.__main__:main"
wecom-svr-local = "wecom_svr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["wecom_svr"]

[tool.ruff]
target-version = "py310"
# 注释里大量中文,80/100 都会逼着把说明拆行,110 是这个仓库的实际舒适宽度
line-length = 110
extend-exclude = ["vendor", ".data"]

[tool.ruff.lint]
# 只收「客观错误 + 现代化」这几档:pyflakes / import 排序 / pyupgrade /
# bugbear / comprehension / ruff 自有规则。
# 刻意不开 S(bandit)、BLE(blind-except)、PTH(os.path→pathlib)、SIM:
# 这个仓库里 `except Exception: pass` 包 osascript / sqlite 大多是有意为之,
# 开了只会逼出一堆 noqa,反而让真问题淹掉。
select = ["E", "W", "F", "I", "UP", "B", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# 测试里 assert 长表达式、fixture 遮蔽同名参数都属正常
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
files = ["wecom_svr"]
# 非 strict:这个仓库大量跟未标注类型的上游代码打交道,
# 一上来 strict 只会得到一屏 Any 相关噪声。先守住「明确写错」的那一档。
# 关掉「配置段没用上」的提示:下面那段 overrides 是防御性的 ——
# 有没有初始化 submodule 决定了哪几个模式会命中,开着只会每次都刷一行 note。
warn_unused_configs = false
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# 上游 wecom-agent 的模块是运行时按路径动态加载的(online_bridge.py / messages.py
# 往 sys.path 里插 vendor 目录),不是本仓库的代码:找不到不算错,找到了也不该
# 顺着进去检查上游 —— 否则上游一次提交就能让我们的 CI 变红。
module = ["online", "online.*", "export_wxwork", "wecom_paths", "wxwork_crypto"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=wecom_svr --cov-report=term-missing"

[tool.coverage.run]
source = ["wecom_svr"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
